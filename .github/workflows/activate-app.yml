name: Activate DECAT app

on:
  schedule:
    # UTC; Beijing time: 02:17, 08:17, 14:17, 20:17.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: decat-app-activation
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out maintenance scripts only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: maintenance
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: maintenance/requirements.txt
      - name: Install the isolated browser dependencies
        run: |
          python -m pip install -r maintenance/requirements.txt
          python -m playwright install --with-deps --only-shell chromium
      - name: Visit the app and wake it if necessary
        run: >-
          python maintenance/activate_app.py
          --url https://decat-ozone.streamlit.app/
          --timeout-seconds 180
          --attempts 2
          --output-dir artifacts/activation
      - name: Save activation report and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: decat-activation-${{ github.run_id }}
          path: artifacts/activation/
          if-no-files-found: warn
          retention-days: 7
